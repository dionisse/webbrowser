    <linearGradient id="ember" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#E23A22" />
      <stop offset="0.55" stop-color="#B81908" />
      <stop offset="1" stop-color="#52392C" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.85">
